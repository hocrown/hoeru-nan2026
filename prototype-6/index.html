<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>회루(回樓) — 지워진 이름을 되살려라</title>
<style>
  html,body{margin:0;padding:0;background:#14120f;height:100%;overflow:hidden;
    font-family:'Noto Serif KR','Noto Serif CJK KR',serif;touch-action:none;}
  #wrap{display:flex;align-items:center;justify-content:center;height:100%;}
  canvas{background:#f2ede3;max-width:100vw;max-height:100vh;box-shadow:0 0 60px rgba(0,0,0,.6);}
</style>
</head>
<body>
<div id="wrap"><canvas id="cv" width="960" height="540"></canvas></div>
<script>
"use strict";
// ============================================================
// 회루(回樓) — 프롤로그: 제일장 (NAN 2026 해커톤 데모 빌드)
// 소환 군단 서바이버 · 뱀서 코어 + TFT식 시너지 압축판
// ============================================================
const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
const W = 960, H = 540;
// --- 모바일 대응: 고해상도 렌더 + 터치 환경 감지 ---
const DPR = Math.min(window.devicePixelRatio||1, 2);
cv.width = W*DPR; cv.height = H*DPR; ctx.scale(DPR, DPR);
// URL에 #touch 를 붙이면 데스크톱에서도 모바일 UI를 강제 (모바일 레이아웃 검수용)
const IS_TOUCH = matchMedia("(pointer:coarse)").matches || location.hash === "#touch";
// --- 이미지 에셋 레이어 (assets/<이름>.png 존재 시 자동 사용, 없으면 절차 생성 폴백) ---
ctx.imageSmoothingEnabled = false; // 픽셀 아트 선명 렌더
const IMG = {};
// 소환수 스프라이트 변형 규약 — 파일이 있으면 자동 사용, 없으면 기본형/절차 폴백:
//   <id>.png    기본 (삼류~일류)
//   <id>_2.png  티어 4~5 (절정·초절정)
//   <id>_3.png  티어 6   (화경)
//   <id>_atk.png 공격 포즈 (스윙 중 스왑)
const SUMMON_IDS=["seo","wolf","crane","turtle","relic2"];
const IMG_LIST=["player","player_res","seo","wolf","crane","turtle","relic2",
 "grunt","wraith","ram","mini","boss","gem"];
SUMMON_IDS.forEach(id=>IMG_LIST.push(id+"_2",id+"_3",id+"_atk"));
IMG_LIST.forEach(n=>{
  const im = new Image();
  im.onload = ()=>{ IMG[n]=im; };
  im.onerror = ()=>{};           // 없으면 폴백 유지
  im.src = "assets/"+n+".png";
});
// ASSET_SPEC 권장 표시 크기 (px). 파일이 이보다 크면 비율 유지로 자동 축소.
// 스펙대로(파일 픽셀 = 표시 크기) 넣으면 축소 없이 1:1 렌더된다.
const SPR_SIZE={player:[30,46],player_res:[30,46],seo:[26,42],wolf:[26,20],crane:[28,20],
  turtle:[24,22],relic2:[10,26],grunt:[24,24],wraith:[22,26],ram:[38,32],
  mini:[52,56],boss:[64,68],gem:[10,10],
  seo_2:[28,44],seo_3:[30,46],seo_atk:[34,42]};
// 표에 없는 변형(<id>_2 등)은 기본형 크기에 경지별 여유를 준 값을 상한으로 삼는다.
const VAR_GROW={_2:1.15,_3:1.3,_atk:1.35};
function sprSize(n){
  if(SPR_SIZE[n])return SPR_SIZE[n];
  const m=n.match(/^(.+)(_2|_3|_atk)$/);
  if(m&&SPR_SIZE[m[1]]){
    const k=VAR_GROW[m[2]],b=SPR_SIZE[m[1]];
    return [Math.round(b[0]*k),Math.round(b[1]*k)];
  }
  return null;
}
// 경지에 따른 스프라이트 변형 선택 (파일 없으면 기본형)
function tierVariant(id){
  const t=(G&&G.roster[id])||1;
  if(t>=6&&IMG[id+"_3"])return id+"_3";
  if(t>=4&&IMG[id+"_2"])return id+"_2";
  return id;
}
function spr(n,x,y,scale=1,flip=false,target){
  const im = IMG[n]; if(!im||!im.width) return false;
  let w = im.width, h = im.height;
  const tg = target||sprSize(n);
  if(tg){                                    // 과대 이미지 방어 — 목표 박스에 맞춰 축소 (확대는 안 함)
    const k = Math.min(tg[0]/w, tg[1]/h);
    if(k < 1){ w*=k; h*=k; }
  }
  w = Math.max(1,Math.round(w*scale)); h = Math.max(1,Math.round(h*scale));
  ctx.save(); ctx.imageSmoothingEnabled=false;   // NEAREST 유지
  ctx.translate(Math.round(x),Math.round(y));
  if(flip) ctx.scale(-1,1);
  ctx.drawImage(im,-w/2,-h/2,w,h);
  ctx.restore(); return true;
}
function goFull(){
  if(document.fullscreenElement) return;
  const el = document.getElementById("wrap");
  if(el.requestFullscreen) el.requestFullscreen().catch(()=>{});
  try{ screen.orientation.lock("landscape").catch(()=>{}); }catch(e){}
}
function isPortrait(){ return innerHeight > innerWidth*1.05; }
addEventListener("contextmenu", e=>e.preventDefault());
const INK="#1c1a17", PAPER="#f2ede3", NAVY="#20242c", BLUE="#3d6b8f",
      RED="#8f2b26", GREY="#6b655c", FAINT="#b8b0a2", GOLD="#a6802a";
const TAU = Math.PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const dist2=(a,b)=>{const dx=a.x-b.x,dy=a.y-b.y;return dx*dx+dy*dy;};
const rnd=(a,b)=>a+Math.random()*(b-a);

// ============================================================
// 오디오 레이어 — WebAudio 절차 SFX + 선택적 BGM 파일(assets/bgm*.mp3)
// 외부 파일이 없어도 SFX는 전부 동작한다. BGM만 무음.
// ============================================================
const MASTER_VOL=0.28, BGM_VOL=0.32;
function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
const AUD={ctx:null,master:null,muted:lsGet("hoiru_mute")==="1",started:false,
           bgm:null,bgmBoss:null,noise:null,last:{}};
function audioInit(){            // 최초 사용자 입력에서 1회 (autoplay 정책)
  if(AUD.started)return; AUD.started=true;
  try{
    const AC=window.AudioContext||window.webkitAudioContext;
    if(AC){
      AUD.ctx=new AC();
      AUD.master=AUD.ctx.createGain();
      AUD.master.gain.value=AUD.muted?0:MASTER_VOL;
      AUD.master.connect(AUD.ctx.destination);
    }
  }catch(e){AUD.ctx=null;}
  bgmInit();
}
function audioResume(){ if(AUD.ctx&&AUD.ctx.state==="suspended")AUD.ctx.resume().catch(()=>{}); }
function toggleMute(){
  AUD.muted=!AUD.muted; lsSet("hoiru_mute",AUD.muted?"1":"0");
  if(AUD.master)AUD.master.gain.value=AUD.muted?0:MASTER_VOL;
}
function noiseBuf(){
  if(AUD.noise)return AUD.noise;
  const c=AUD.ctx,n=Math.floor(c.sampleRate*0.7),b=c.createBuffer(1,n,c.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
  AUD.noise=b; return b;
}
function tone(o){                // 오실레이터 1개 = 감쇠 톤
  if(!AUD.ctx||AUD.muted)return;
  const c=AUD.ctx,t0=c.currentTime+(o.delay||0),dur=o.dur||0.2,v=o.vol||0.15;
  const osc=c.createOscillator(),g=c.createGain();
  osc.type=o.type||"sine";
  osc.frequency.setValueAtTime(o.f,t0);
  if(o.f2)osc.frequency.exponentialRampToValueAtTime(Math.max(20,o.f2),t0+dur);
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.exponentialRampToValueAtTime(v,t0+(o.atk||0.006));
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  osc.connect(g);g.connect(AUD.master);
  osc.start(t0);osc.stop(t0+dur+0.03);
}
function nz(o){                  // 필터링된 노이즈 버스트 (붓질·타격음 재료)
  if(!AUD.ctx||AUD.muted)return;
  const c=AUD.ctx,t0=c.currentTime+(o.delay||0),dur=o.dur||0.2;
  const s=c.createBufferSource();s.buffer=noiseBuf();
  const f=c.createBiquadFilter();f.type=o.type||"lowpass";
  f.frequency.setValueAtTime(o.fc||1200,t0);
  if(o.fc2)f.frequency.exponentialRampToValueAtTime(Math.max(40,o.fc2),t0+dur);
  f.Q.value=o.q||1;
  const g=c.createGain();
  g.gain.setValueAtTime(o.vol||0.12,t0);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  s.connect(f);f.connect(g);g.connect(AUD.master);
  s.start(t0);s.stop(t0+dur+0.03);
}
function sfxGate(k,ms){          // 동시 다발 타격음 폭주 방지
  const n=performance.now();
  if(AUD.last[k]&&n-AUD.last[k]<ms)return false;
  AUD.last[k]=n;return true;
}
const SFX={
  hit(){ if(!sfxGate("hit",45))return;                       // 타격 — 약한 틱
    nz({type:"highpass",fc:2600,dur:0.045,vol:0.05});
    tone({f:rnd(680,860),f2:300,type:"triangle",dur:0.05,vol:0.045}); },
  kill(){ if(!sfxGate("kill",55))return;                     // 처치 — 먹 퍼지는 낮은 팝
    tone({f:190,f2:52,type:"sine",dur:0.22,vol:0.12});
    nz({type:"lowpass",fc:900,fc2:180,dur:0.26,vol:0.075}); },
  summon(){                                                  // 신규 계약 등장
    [0,0.09,0.18].forEach((d,i)=>tone({f:294*Math.pow(1.26,i),type:"triangle",dur:0.42,vol:0.09,delay:d}));
    nz({type:"bandpass",fc:1800,fc2:700,q:2,dur:0.4,vol:0.05}); },
  promote(big){                                              // 승급 — 상행 아르페지오
    const base=big?261.6:220;
    [0,0.08,0.16,0.26].forEach((d,i)=>tone({f:base*Math.pow(1.26,i),type:"triangle",
      dur:0.5,vol:big?0.1:0.08,delay:d}));
    if(big){ tone({f:base*2,type:"sine",dur:1.3,vol:0.08,delay:0.32,atk:0.02});
      nz({type:"bandpass",fc:2600,fc2:600,q:2,dur:0.6,vol:0.055}); } },
  pick(){                                                    // 선택 확정 — 목판 딱
    tone({f:1180,f2:900,type:"square",dur:0.05,vol:0.05});
    tone({f:590,type:"sine",dur:0.16,vol:0.08,delay:0.02}); },
  res(){                                                     // 공명 — 장중한 종
    [1,2.01,2.79,4.07].forEach((m,i)=>
      tone({f:146.8*m,type:"sine",dur:2.8-i*0.45,vol:0.17/(i*1.4+1),atk:0.012}));
    tone({f:73.4,type:"sine",dur:2.2,vol:0.12,atk:0.02});
    nz({type:"lowpass",fc:1400,fc2:200,dur:0.7,vol:0.07}); },
  ilseom(){                                                  // 일섬 — 붓질 스윕
    nz({type:"bandpass",fc:5200,fc2:420,q:1.4,dur:0.38,vol:0.13});
    tone({f:1400,f2:180,type:"sawtooth",dur:0.3,vol:0.05}); },
  hurt(){ if(!sfxGate("hurt",180))return;                    // 피격
    tone({f:172,f2:64,type:"square",dur:0.26,vol:0.11});
    nz({type:"lowpass",fc:600,fc2:120,dur:0.3,vol:0.09}); },
  boss(){                                                    // 보스 등장 — 저음 징
    tone({f:58,type:"sawtooth",dur:2.6,vol:0.15,atk:0.05});
    tone({f:87,type:"sine",dur:2.2,vol:0.1,atk:0.08});
    tone({f:116.5,type:"sine",dur:1.6,vol:0.07,atk:0.1,delay:0.05});
    nz({type:"lowpass",fc:2400,fc2:150,dur:1.4,vol:0.09}); },
  bossAtk(){ if(!sfxGate("bossAtk",200))return;             // 보스/엘리트 공격
    tone({f:110,f2:44,type:"sawtooth",dur:0.4,vol:0.09});
    nz({type:"lowpass",fc:1200,fc2:200,dur:0.35,vol:0.07}); },
  dash(){ if(!sfxGate("dash",120))return;                    // 경공
    nz({type:"bandpass",fc:2600,fc2:800,q:1.2,dur:0.16,vol:0.06}); },
  just(){ tone({f:1320,type:"sine",dur:0.28,vol:0.09});      // 저스트 회피
    tone({f:1980,type:"sine",dur:0.2,vol:0.05,delay:0.03}); },
  over(){                                                    // 책이 덮인다
    tone({f:196,f2:49,type:"sine",dur:1.7,vol:0.14,atk:0.02});
    nz({type:"lowpass",fc:700,fc2:90,dur:1.2,vol:0.08}); },
  win(){                                                     // 복원 완료
    [0,0.14,0.28,0.5].forEach((d,i)=>tone({f:[293.7,392,587.3,783.99][i],
      type:"sine",dur:1.6,vol:0.11,atk:0.02,delay:d}));
    nz({type:"lowpass",fc:1600,fc2:250,dur:0.8,vol:0.06}); },
};
// --- BGM: 파일이 있으면 루프, 없으면 조용히 무시 ---
function mkBgm(src){
  const a=new Audio(); a.loop=true; a.preload="auto"; a.volume=0; a.ok=false;
  a.addEventListener("canplay",()=>{a.ok=true;});
  a.addEventListener("error",()=>{a.ok=false;});
  a.src=src; return a;
}
function bgmInit(){
  if(AUD.bgm)return;
  try{ AUD.bgm=mkBgm("assets/bgm.mp3"); AUD.bgmBoss=mkBgm("assets/bgm_boss.mp3"); }catch(e){}
}
function bgmUpdate(dt){          // 보스 페이즈 크로스페이드
  const bossOn=!!(G&&G.bossPhase&&scene!=="title"&&AUD.bgmBoss&&AUD.bgmBoss.ok);
  const pair=[[AUD.bgm,!bossOn],[AUD.bgmBoss,bossOn]];
  for(const pr of pair){
    const a=pr[0],on=pr[1];
    if(!a||!a.ok)continue;
    const tgt=(AUD.muted||!AUD.started)?0:(on?BGM_VOL:0);
    const d=tgt-a.volume,st=dt*0.8;
    a.volume=clamp(Math.abs(d)<=st?tgt:a.volume+(d>0?st:-st),0,1);
    if(a.volume>0.001){ if(a.paused)a.play().catch(()=>{}); }
    else if(!a.paused)a.pause();
  }
}
// --- 음소거 토글 버튼 (우상단) ---
const MUTE_BTN={x:W-26,y:24,r:16};
function drawMuteBtn(){
  const b=MUTE_BTN;
  ctx.save();
  ctx.globalAlpha=0.72;
  ctx.fillStyle=INK;ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,TAU);ctx.fill();
  ctx.globalAlpha=1;
  ctx.translate(b.x-1,b.y);
  // 스피커 몸통 — 사각(넥) + 원뿔. 이모지 폰트 의존 없이 벡터로만 그린다.
  ctx.fillStyle=PAPER;
  ctx.beginPath();
  ctx.moveTo(-8,-3);ctx.lineTo(-4.5,-3);ctx.lineTo(-0.5,-7.5);
  ctx.lineTo(-0.5,7.5);ctx.lineTo(-4.5,3);ctx.lineTo(-8,3);
  ctx.closePath();ctx.fill();
  ctx.strokeStyle=PAPER;ctx.lineCap="round";
  if(AUD.muted){        // 꺼짐 — X 두 선
    ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(3,-4.5);ctx.lineTo(9.5,4);ctx.stroke();
    ctx.beginPath();ctx.moveTo(9.5,-4.5);ctx.lineTo(3,4);ctx.stroke();
  }else{                // 켜짐 — 음파 호 2개
    ctx.lineWidth=1.8;
    ctx.beginPath();ctx.arc(0,0,5,-0.72,0.72);ctx.stroke();
    ctx.beginPath();ctx.arc(0,0,8.6,-0.72,0.72);ctx.stroke();
  }
  ctx.lineCap="butt";ctx.lineWidth=1;
  ctx.restore();
}

// ---------- 상태 ----------
let scene="title";            // title | play | levelup | over | win | pause
let regressions=0;            // 회귀 횟수 (사망 카운트)
let G=null;                   // 런 상태

const RUN_LEN=360, MINI_T=180, BOSS_T=330;
const TIERS=["삼류","이류","일류","절정","초절정","화경"];
const TIER_MUL=[1,1.18,1.4,1.66,1.96,2.32];

// ---------- 유닛 정의 ----------
const UNITS={
  seo:{name:"유서린",tags:["baekdo","sword"],desc:"유수검 — 근접 연격, 3타째 관통",col:BLUE,max:6},
  wolf:{name:"백랑",tags:["baekdo"],desc:"신수 — 가장 가까운 적을 추격해 문다",col:"#4a5a66",max:6},
  crane:{name:"백학",tags:["baekdo"],desc:"신수 — 깃털 투사체를 날린다",col:"#7a8a94",max:6},
  turtle:{name:"석귀",tags:["baekdo"],desc:"신수 — 느리게 돌며 부딪혀 밀어낸다",col:"#5d6155",max:6},
  relic1:{name:"유엽검령",tags:["sword"],desc:"검령 — 유서린에 깃들어 공속 +12%",col:"#8a9aa8",max:1},
  relic2:{name:"명검 류월",tags:["sword"],desc:"검령 — 스스로 날아 적을 벤다",col:"#9aa8b8",max:1},
  heal:{name:"환약",tags:[],desc:"기력 35 회복",col:"#6b7a4a",max:99,consume:true},
};
const SYN={
  baekdo:{name:"백도맹",steps:[2,4],
    desc:["호신강기 — 피격 1회 무효 (8초 재생)","협공 — 다중 타격 대상 피해 +25%"]},
  sword:{name:"검",steps:[2,3],
    desc:["검격에 관통 검기 파동","일섬 — 12초마다 전장 참격"]},
};

// ---------- 입력 ----------
const keys={};
let touchMove=null, lastTap=0;
addEventListener("keydown",e=>{
  keys[e.code]=true;
  audioInit(); audioResume();
  if(e.code==="Space")e.preventDefault();
  if(e.code==="KeyM"){toggleMute();return;}
  if(scene==="title"&&(e.code==="Enter"||e.code==="Space"))startRun();
  else if(scene==="levelup"&&["Digit1","Digit2","Digit3"].includes(e.code))pick(+e.code.slice(5)-1);
  else if((scene==="over"||scene==="win")&&e.code==="KeyR")startRun();
  else if(scene==="play"&&(e.code==="KeyP"||e.code==="Escape"))scene="pause";
  else if(scene==="pause"&&(e.code==="KeyP"||e.code==="Escape"))scene="play";
  else if(scene==="play"&&e.code==="KeyE")resonate();
  else if(scene==="play"&&e.code==="Space")dash();
});
addEventListener("keyup",e=>keys[e.code]=false);
function canvasPos(e){const r=cv.getBoundingClientRect();
  return {x:(e.clientX-r.left)*W/r.width, y:(e.clientY-r.top)*H/r.height};}
const DASH_BTN={x:W-60,y:H-62,r:36};        // 경공 — 우하단 (주 버튼)
const RES_BTN={x:W-148,y:H-86,r:30};        // 공명 — 경공의 좌상단 대각 (우측 클러스터)
let pendingStick=null;                       // 버튼을 누른 손가락이 드래그로 이어질 때 조이스틱 전환용
const hitBtn=(p,b)=>(p.x-b.x)**2+(p.y-b.y)**2<b.r**2;
cv.addEventListener("pointerdown",e=>{
  e.preventDefault();
  audioInit(); audioResume();
  const p=canvasPos(e);
  if(hitBtn(p,MUTE_BTN)){toggleMute();return;}   // 음소거 토글은 모든 화면에서 최우선
  if(IS_TOUCH) goFull();
  if(scene==="title")startRun();
  else if(scene==="over"||scene==="win")startRun();
  else if(scene==="levelup"){
    for(let i=0;i<3;i++){if(p.x>150+i*230&&p.x<150+i*230+210&&p.y>170&&p.y<390){pick(i);return;}}
  }else if(scene==="pause"){
    if(!(IS_TOUCH&&isPortrait()))scene="play";
  }else if(scene==="play"){
    // 버튼: 발동 후에도 같은 손가락 드래그가 이어지면 조이스틱으로 전환됨
    if(IS_TOUCH&&hitBtn(p,DASH_BTN)){dash();pendingStick={pid:e.pointerId,x:p.x,y:p.y};return;}
    if(IS_TOUCH&&hitBtn(p,RES_BTN)){resonate();pendingStick={pid:e.pointerId,x:p.x,y:p.y};return;}
    if(touchMove){dash();return;}            // 조이스틱 유지 중 다른 손가락 탭 = 경공
    const now=performance.now();
    if(now-lastTap<280)dash();
    lastTap=now;
    touchMove={ox:p.x,oy:p.y,x:p.x,y:p.y,pid:e.pointerId};
  }
});
cv.addEventListener("pointermove",e=>{
  if(touchMove&&e.pointerId===touchMove.pid){const p=canvasPos(e);touchMove.x=p.x;touchMove.y=p.y;return;}
  if(pendingStick&&e.pointerId===pendingStick.pid&&!touchMove){
    const p=canvasPos(e);
    if(Math.hypot(p.x-pendingStick.x,p.y-pendingStick.y)>14){
      touchMove={ox:p.x,oy:p.y,x:p.x,y:p.y,pid:e.pointerId};pendingStick=null;}
  }
});
function endPointer(e){
  if(touchMove&&e.pointerId===touchMove.pid)touchMove=null;
  if(pendingStick&&e.pointerId===pendingStick.pid)pendingStick=null;
}
addEventListener("pointerup",endPointer);
addEventListener("pointercancel",endPointer);

// ---------- 런 초기화 ----------
function startRun(){
  G={t:0,kill:0,lvl:1,xp:0,xpNeed:10,
    p:{x:W/2,y:H/2,hp:100,hpMax:100,spd:200,inv:0,dashCd:0,dashT:0,dx:0,dy:1,shield:0,shieldCd:0},
    roster:{},          // id -> tier(1..)
    summons:[],enemies:[],shots:[],eshots:[],gems:[],fx:[],dmgTx:[],
    tags:{baekdo:0,sword:0},
    slashTimer:12,offers:null,boss:null,miniDone:false,bossPhase:false,
    res:0,resT:0,resFace:{x:1,y:0},resUsed:false,lastJust:-9,parts:[],ghAcc:0,
    shake:0,hitstop:0,dimT:0,rank:{hitTaken:0}};
  addUnit("seo");
  scene="play";
}
function tagsRecalc(){
  const t={baekdo:0,sword:0};
  for(const id in G.roster){for(const tg of UNITS[id].tags)t[tg]++;}
  const before={...G.tags}; G.tags=t;
  for(const k in t)if(synStep(k)>((SYN[k].steps.filter(s=>before[k]>=s)).length))
    G.fx.push({type:"synflash",t:0,tag:k});
}
function synStep(tag){return SYN[tag].steps.filter(s=>G.tags[tag]>=s).length;}
function addUnit(id){
  if(UNITS[id].consume){G.p.hp=Math.min(G.p.hpMax,G.p.hp+35);return;}
  const had=G.roster[id]||0;
  if(had){                        // --- 승급 (경지 상승) ---
    const nt=Math.min(had+1,TIERS.length);
    G.roster[id]=nt;
    const s=G.summons.find(q=>q.id===id);
    const big=(nt===4||nt===6);   // 스프라이트 변형이 바뀌는 경지 — 연출을 더 크게
    G.fx.push({type:"promote",x:s?s.x:G.p.x,y:s?s.y:G.p.y,t:0,tier:nt,big,s:s||null});
    SFX.promote(big);
    if(big)G.dimT=Math.max(G.dimT,0.3);
  }else{                          // --- 신규 계약 (새 이름이 왔다) ---
    G.roster[id]=1;
    let s=null;
    if(id!=="relic1")G.summons.push(s=makeSummon(id));
    else s=G.summons.find(q=>q.id==="seo")||null;   // 검령은 유서린에 깃든다
    G.fx.push({type:"summonpop",x:s?s.x:G.p.x,y:s?s.y:G.p.y,t:0});
    G.fx.push({type:"nametag",s,x:G.p.x,y:G.p.y,id,t:0});
    SFX.summon();
  }
  tagsRecalc();
}
function makeSummon(id){
  const base={id,x:G.p.x,y:G.p.y,ang:rnd(0,TAU),cd:0,hitCd:0,sw:0,swTg:null,face:{x:1,y:0}};
  return base;
}
function tierOf(id){return G.roster[id]||1;}
function mul(id){return TIER_MUL[tierOf(id)-1];}

// ---------- 호명 (레벨업 3택1) ----------
function rollOffers(){
  const pool=Object.keys(UNITS).filter(id=>{
    const have=G.roster[id]||0;
    return have<UNITS[id].max;
  });
  // 활성 태그 가중 (스마트 드랍)
  const weight=id=>{
    let w=10;
    for(const tg of UNITS[id].tags)if(G.tags[tg]>0)w+=4;
    if(UNITS[id].consume)w=G.p.hp<G.p.hpMax*0.6?14:5;
    return w;
  };
  const offers=[];
  const p2=[...pool];
  while(offers.length<3&&p2.length){
    let tot=p2.reduce((s,id)=>s+weight(id),0),r=Math.random()*tot,idx=0;
    for(let i=0;i<p2.length;i++){r-=weight(p2[i]);if(r<=0){idx=i;break;}}
    offers.push(p2.splice(idx,1)[0]);
  }
  G.offers=offers;
  if(offers.length===0){G.p.hp=Math.min(G.p.hpMax,G.p.hp+35);G.offers=null;return;}
  scene="levelup";
}
function pick(i){
  if(!G.offers||!G.offers[i])return;
  SFX.pick();
  addUnit(G.offers[i]); G.offers=null; scene="play";
}

// ---------- 공명 (共鳴) ----------
function burst(x,y,col,n,spd,life=0.5,size=3){
  for(let i=0;i<n;i++){const a=rnd(0,TAU),v=rnd(spd*0.3,spd);
    G.parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,t:0,life:rnd(life*0.6,life),col,size:rnd(1.5,size)});}
  if(G.parts.length>320)G.parts.splice(0,G.parts.length-320);
}
// 먹 튀김 — 속도 방향으로 늘어나는 획 파티클 (붓 흩뿌림 느낌)
function inkSplat(x,y,n,spd){
  for(let i=0;i<n;i++){const a=rnd(0,TAU),v=rnd(spd*0.45,spd);
    G.parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,t:0,life:rnd(0.35,0.7),
      col:Math.random()<0.25?"#3a3630":INK,size:rnd(1.2,3.2),streak:true});}
  G.parts.push({x,y,vx:0,vy:0,t:0,life:0.45,col:INK,size:rnd(5,9),blot:true});
  if(G.parts.length>320)G.parts.splice(0,G.parts.length-320);
}
// 화면 흔들림 — 진폭 3px 상한 (보스 공격·일섬 등 큰 순간에만)
function shakeAdd(v){ if(G)G.shake=Math.min(3,Math.max(G.shake,v)); }
function gainRes(v){ if(G.resT<=0) G.res=Math.min(100,G.res+v); }
function resonate(){
  if(!G||G.res<100||G.resT>0||scene!=="play")return;
  G.res=0; G.resT=7; G.p.inv=0.4;
  SFX.res(); G.hitstop=0.25; G.dimT=0.45;      // 히트스톱 + 암전 펄스
  G.fx.push({type:"shieldpop",x:G.p.x,y:G.p.y,t:0});
  if(!G.resUsed){G.resUsed=true;G.fx.push({type:"resmsg",t:0});}
}

// ---------- 대시 ----------
function dash(){
  const p=G.p;
  if(p.dashCd>0)return;
  p.dashCd=1.5; p.dashT=0.16; p.inv=Math.max(p.inv,0.24); SFX.dash();
  G.fx.push({type:"dashline",t:0,x:p.x,y:p.y,dx:p.dx,dy:p.dy});
}

// ---------- 적 스폰 ----------
function hpScale(){return 1+G.t/95;}
function ringSpawn(n){

function spawnMini(){

}

// ---------- 전투 유틸 ----------
function coopMul(e){
  // 백도맹 4: 최근 2초 내 서로 다른 2 소스 이상 타격 시 +25%
  if(synStep("baekdo")<2)return 1;
  const now=G.t;
  e.lastHits=e.lastHits.filter(h=>now-h.t<2);
  const srcs=new Set(e.lastHits.map(h=>h.src));
  return srcs.size>=2?1.25:1;
}
function hitEnemy(e,dmg,src){
  e.lastHits.push({t:G.t,src});
  const d=dmg*coopMul(e);
  e.hp-=d; e.flash=0.06;                    // 히트 플래시 (약 2프레임)
  G.dmgTx.push({x:e.x+rnd(-6,6),y:e.y-e.r,v:Math.round(d),t:0});
  G.fx.push({type:"splash",x:e.x,y:e.y,t:0});
  SFX.hit();
  if(e.hp<=0)killEnemy(e);
}
function killEnemy(e){
  if(e.dead)return; e.dead=true; G.kill++;
  if(G.resT>0)G.resT=Math.min(G.resT+0.3,10); else gainRes(2);
  burst(e.x,e.y,INK,e.boss?28:8,e.boss?280:150,0.5);
  inkSplat(e.x,e.y,e.boss?18:6,e.boss?260:150);   // 먹 튀김
  SFX.kill();
  if(e.boss){shakeAdd(3);G.dimT=Math.max(G.dimT||0,0.35);}
  const n=e.boss?12:(e.k==="ram"?4:1);
  for(let i=0;i<n;i++)G.gems.push({x:e.x+rnd(-10,10),y:e.y+rnd(-10,10),v:e.k==="wraith"?2:2});
  G.fx.push({type:"erase",x:e.x,y:e.y,r:e.r,t:0});
  if(e.k==="mini")G.miniDone=true;
  if(e.k==="boss")setTimeout(()=>{if(scene==="play")winRun();},600);
}
function hurtPlayer(dmg){
  const p=G.p;
  if(G.resT>0){ // 공명 중: 피해는 남은 시간으로 전환 (그녀가 지킨다)
    if(p.inv>0)return;
    p.inv=0.4; G.resT=Math.max(0,G.resT-1.5);
    G.fx.push({type:"shieldpop",x:p.x,y:p.y,t:0}); return;
  }
  if(p.dashT>0){ // 저스트 회피 — 공명 게이지 획득
    if(G.t-G.lastJust>0.5){G.lastJust=G.t;gainRes(12);G.fx.push({type:"just",x:p.x,y:p.y,t:0});
      SFX.just(); burst(p.x,p.y,GOLD,10,190,0.5,2.5);}
    return;
  }
  if(p.inv>0)return;
  if(p.shield>0){p.shield=0;p.shieldCd=8;p.inv=0.6;G.fx.push({type:"shieldpop",x:p.x,y:p.y,t:0});return;}
  p.hp-=dmg; p.inv=0.7; p.flash=0.06; G.rank.hitTaken++; SFX.hurt();
  if(p.hp<=0){regressions++;scene="over";SFX.over();}
}
function winRun(){
  scene="win"; SFX.win();
}

// ---------- 업데이트 ----------
let last=performance.now();
function frame(now){
  const dt=Math.min((now-last)/1000,0.05); last=now;
  bgmUpdate(dt);
  if(IS_TOUCH&&scene==="play"&&isPortrait())scene="pause";
  let sdt=dt;
  if(G&&G.hitstop>0){G.hitstop-=dt;sdt=dt*0.06;}   // 히트스톱 (완전 정지 대신 초저속)
  if(scene==="play")update(sdt);
  draw();
  if(IS_TOUCH&&isPortrait()){
    ctx.fillStyle="rgba(28,26,23,0.75)";ctx.fillRect(0,0,W,H);
    ctx.fillStyle=PAPER;ctx.textAlign="center";
    ctx.font="bold 26px serif";ctx.fillText("기기를 가로로 돌려주세요",W/2,H/2-10);
    ctx.font="15px serif";ctx.fillStyle=FAINT;
    ctx.fillText("回樓는 가로 화면 전용입니다",W/2,H/2+24);
  }
  drawMuteBtn();
  requestAnimationFrame(frame);
}
function update(dt){
  const p=G.p; G.t+=dt;
  // --- 이동 ---
  let mx=(keys.ArrowRight||keys.KeyD?1:0)-(keys.ArrowLeft||keys.KeyA?1:0);
  let my=(keys.ArrowDown||keys.KeyS?1:0)-(keys.ArrowUp||keys.KeyW?1:0);
  if(touchMove){const dx=touchMove.x-touchMove.ox,dy=touchMove.y-touchMove.oy,l=Math.hypot(dx,dy);
    if(l>10){mx=dx/l;my=dy/l;}}
  const ml=Math.hypot(mx,my);
  if(ml>0){mx/=ml;my/=ml;p.dx=mx;p.dy=my;}
  const spd=p.dashT>0?640:(G.resT>0?300:p.spd);
  p.x=clamp(p.x+(p.dashT>0?p.dx:mx)*spd*dt,14,W-14);
  p.y=clamp(p.y+(p.dashT>0?p.dy:my)*spd*dt,14,H-14);
  p.inv=Math.max(0,p.inv-dt);p.dashCd=Math.max(0,p.dashCd-dt);p.dashT=Math.max(0,p.dashT-dt);
  if(p.flash>0)p.flash-=dt;
  if(G.dimT>0)G.dimT-=dt;
  if(p.dashT>0||G.resT>0){G.ghAcc+=dt;
    if(G.ghAcc>0.035){G.ghAcc=0;
      G.fx.push({type:"ghost",x:p.x,y:p.y,t:0,col:G.resT>0?BLUE:"#33404e"});}}
  // 호신강기 (백도맹 2)
  if(synStep("baekdo")>=1){
    if(p.shield<1){p.shieldCd-=dt;if(p.shieldCd<=0)p.shield=1;}
  }else p.shield=0;
  // --- 일섬 (검 3) ---
  if(synStep("sword")>=2){
    G.slashTimer-=dt;
    if(G.slashTimer<=0){G.slashTimer=12;
      const y=p.y;
      G.fx.push({type:"ilseom",y,t:0,seed:rnd(0,10)}); shakeAdd(3); SFX.ilseom();
      for(const e of G.enemies)if(Math.abs(e.y-y)<46)hitEnemy(e,80,"ilseom");
    }
  }
  // --- 공명 진행 ---
  if(G.resT>0){
    if(ml>0)G.resFace={x:mx,y:my};
    p.resAtk=(p.resAtk||0)-dt;
    if(p.resAtk<=0){p.resAtk=0.25;
      const tg=nearestEnemy(p.x,p.y,115);
      if(tg){hitEnemy(tg,16*mul("seo"),"res");
        G.fx.push({type:"slash",x:tg.x,y:tg.y,t:0});
        burst(tg.x,tg.y,BLUE,4,140,0.35,2);
        if(synStep("sword")>=1){const dx=tg.x-p.x,dy=tg.y-p.y,l=Math.hypot(dx,dy)||1;
          wave(p.x,p.y,dx/l,dy/l,10*mul("seo"),"res");}}}
    G.resT-=dt;
    if(G.resT<=0){ // 피니시: 유수만리 — 전방 부채꼴 5연 검파
      const f=G.resFace,ba=Math.atan2(f.y,f.x);
      for(let i=-2;i<=2;i++)wave(p.x,p.y,Math.cos(ba+i*0.28),Math.sin(ba+i*0.28),24*mul("seo"),"res");
      G.fx.push({type:"finflash",x:p.x,y:p.y,t:0});
      burst(p.x,p.y,BLUE,32,330,0.7,3.5); shakeAdd(2.5); SFX.ilseom();
    }
  }
  // --- 소환수 ---
  let orbitN=G.summons.filter(s=>s.id!=="relic2"&&!(s.id==="seo"&&G.resT>0)).length,oi=0;
  for(const s of G.summons){
    const u=UNITS[s.id];
    if(s.id==="seo"&&G.resT>0){s.sw=0;continue;} // 공명 중 — 그녀는 도윤과 함께 있다
    if(s.sw>0){s.sw-=dt;if(s.sw<=0){s.sw=0;summonFire(s);}}   // 스윙 진행/종료
    if(s.id==="relic2"){ // 자율 검
      s.cd-=dt;
      const tg=nearestEnemy(s.x,s.y,520);
      if(tg){const dx=tg.x-s.x,dy=tg.y-s.y,l=Math.hypot(dx,dy)||1;
        s.x+=dx/l*300*dt;s.y+=dy/l*300*dt;
        if(l<26&&s.cd<=0&&s.sw<=0){s.cd=1.1;swingStart(s,tg,dx,dy,l);}}
      else{s.x+=(p.x+40-s.x)*2*dt;s.y+=(p.y-40-s.y)*2*dt;}
      continue;
    }
    // 궤도 배치 — 공유 각도 + 균등 간격 (겹침 방지)
    const R=46+8*orbitN, bAng=G.t*1.1;
    const tx=p.x+Math.cos(bAng+oi*TAU/Math.max(orbitN,1))*R,ty=p.y+Math.sin(bAng+oi*TAU/Math.max(orbitN,1))*R;
    s.x+= (tx-s.x)*6*dt; s.y+=(ty-s.y)*6*dt; oi++;
    s.cd-=dt;
    if(s.id==="seo"){
      const rate=0.9/(G.roster.relic1?1.12:1);
      const tg=nearestEnemy(s.x,s.y,120);
      if(tg&&s.cd<=0&&s.sw<=0){s.cd=rate;
        const dx=tg.x-s.x,dy=tg.y-s.y,l=Math.hypot(dx,dy)||1;swingStart(s,tg,dx,dy,l);}
    }else if(s.id==="wolf"){
      const tg=nearestEnemy(p.x,p.y,340);
      if(tg){const dx=tg.x-s.x,dy=tg.y-s.y,l=Math.hypot(dx,dy)||1;
        s.x+=dx/l*250*dt;s.y+=dy/l*250*dt;
        if(l<20&&s.cd<=0&&s.sw<=0){s.cd=0.7;swingStart(s,tg,dx,dy,l);}}
    }else if(s.id==="crane"){
      const tg=nearestEnemy(s.x,s.y,420);
      if(tg&&s.cd<=0&&s.sw<=0){s.cd=1.4;
        const dx=tg.x-s.x,dy=tg.y-s.y,l=Math.hypot(dx,dy)||1;swingStart(s,tg,dx,dy,l);}
    }else if(s.id==="turtle"){
      // 석귀는 몸통 박치기 — 접촉 즉시 판정, 스윙은 시각 효과로만
      for(const e of G.enemies){
        if(dist2(s,e)<(e.r+14)**2&&s.cd<=0){s.cd=0.8;hitEnemy(e,7*mul("turtle"),"turtle");
          const dx=e.x-s.x,dy=e.y-s.y,l=Math.hypot(dx,dy)||1;e.x+=dx/l*26;e.y+=dy/l*26;
          s.sw=SWING;s.swTg=null;s.face={x:dx/l,y:dy/l};}
      }
    }
  }
  // --- 투사체 ---
  for(const sh of G.shots){sh.x+=sh.vx*dt;sh.y+=sh.vy*dt;sh.life-=dt;
    for(const e of G.enemies){if(!e.dead&&dist2(sh,e)<(e.r+4)**2){hitEnemy(e,sh.dmg,sh.src);
      if(sh.pierce>0)sh.pierce--;else sh.life=0;break;}}}
  G.shots=G.shots.filter(s=>s.life>0&&s.x>-30&&s.x<W+30&&s.y>-30&&s.y<H+30);
  for(const sh of G.eshots){sh.x+=sh.vx*dt;sh.y+=sh.vy*dt;sh.life-=dt;
    if(dist2(sh,p)<(10)**2){hurtPlayer(sh.dmg);sh.life=0;}}
  G.eshots=G.eshots.filter(s=>s.life>0);
  // --- 적 ---
  for(const e of G.enemies){
    if(e.dead)continue;
    e.wob+=dt*4;
    if(e.flash>0)e.flash-=dt;
    if(e.k==="grunt"||e.k==="mini"){
      const dx=p.x-e.x,dy=p.y-e.y,l=Math.hypot(dx,dy)||1;
      e.x+=dx/l*e.spd*dt;e.y+=dy/l*e.spd*dt;
      if(e.k==="mini"){e.cd-=dt;if(e.cd<=0){e.cd=2.6;radial(e,10,120,10);shakeAdd(2);SFX.bossAtk();}}
    }else if(e.k==="wraith"){
      const dx=p.x-e.x,dy=p.y-e.y,l=Math.hypot(dx,dy)||1;
      if(l>190){e.x+=dx/l*e.spd*dt;e.y+=dy/l*e.spd*dt;}
      e.cd-=dt;
      if(e.cd<=0){e.cd=2.4;
        G.eshots.push({x:e.x,y:e.y,vx:dx/l*180,vy:dy/l*180,dmg:e.dmg,life:3});}
    }else if(e.k==="ram"){
      if(e.state==="walk"){
        const dx=p.x-e.x,dy=p.y-e.y,l=Math.hypot(dx,dy)||1;
        e.x+=dx/l*e.spd*dt;e.y+=dy/l*e.spd*dt;
        if(l<260){e.state="aim";e.aim=0.9;e.tx=p.x;e.ty=p.y;}
      }else if(e.state==="aim"){
        e.aim-=dt;
        if(e.aim<=0){const dx=e.tx-e.x,dy=e.ty-e.y,l=Math.hypot(dx,dy)||1;
          e.vx=dx/l*430;e.vy=dy/l*430;e.state="dash";e.aim=0.55;}
      }else{e.aim-=dt;e.x+=e.vx*dt;e.y+=e.vy*dt;if(e.aim<=0)e.state="walk";}
    }else if(e.k==="boss"){
      e.cd-=dt;
      if(e.state==="walk"){
        const dx=p.x-e.x,dy=p.y-e.y,l=Math.hypot(dx,dy)||1;
        e.x+=dx/l*e.spd*dt;e.y+=dy/l*e.spd*dt;
        if(e.cd<=0){e.pat=(e.pat+1)%3;e.cd=3.2;
          if(e.pat===0){radial(e,16,150,12);shakeAdd(2);SFX.bossAtk();}
          else if(e.pat===1){e.state="aim";e.aim=0.9;e.tx=p.x;e.ty=p.y;}
          else{for(let i=0;i<3;i++)spawnEnemy("grunt");}}
      }else if(e.state==="aim"){e.aim-=dt;
        if(e.aim<=0){const dx=e.tx-e.x,dy=e.ty-e.y,l=Math.hypot(dx,dy)||1;
          e.vx=dx/l*470;e.vy=dy/l*470;e.state="dash";e.aim=0.6;
          shakeAdd(2.5);SFX.bossAtk();}}
      else{e.aim-=dt;e.x+=e.vx*dt;e.y+=e.vy*dt;if(e.aim<=0)e.state="walk";}
    }
    if(dist2(e,p)<(e.r+9)**2)hurtPlayer(e.dmg);
  }
  G.enemies=G.enemies.filter(e=>!e.dead);
  // --- 젬 ---
  for(const g of G.gems){
    const d=dist2(g,p);
    if(d<70*70){const dx=p.x-g.x,dy=p.y-g.y,l=Math.hypot(dx,dy)||1;g.x+=dx/l*300*dt;g.y+=dy/l*300*dt;}
    if(d<14*14){g.got=true;G.xp+=g.v;
      if(G.xp>=G.xpNeed){G.xp-=G.xpNeed;G.lvl++;G.xpNeed=Math.round(G.xpNeed*1.25);rollOffers();}}
  }
  G.gems=G.gems.filter(g=>!g.got);
  // --- 스폰 테이블 ---
  if(!G.bossPhase){
    const t=G.t;
    let rate = t<60?1.0 : t<120?1.6 : t<180?2.2 : t<240?3.2 : 4.2;
    G.spawnAcc=(G.spawnAcc||0)+dt*rate;
    while(G.spawnAcc>=1){G.spawnAcc-=1;
      const r=Math.random();
      if(t>70&&r<0.22)spawnEnemy("wraith");
      else if(t>130&&r<(t>180?0.36:0.30))spawnEnemy("ram");
      else spawnEnemy("grunt");}
    if(t>210&&!G.ring1){G.ring1=true;ringSpawn(14);}
    if(t>270&&!G.ring2){G.ring2=true;ringSpawn(18);}
    if(t>=MINI_T&&!G.miniSpawned){G.miniSpawned=true;spawnMini();}
    if(t>=BOSS_T){G.enemies=G.enemies.filter(e=>e.boss);spawnBoss();}
  }
  // --- fx ---
  for(const f of G.fx)f.t+=dt;
  G.fx=G.fx.filter(f=>f.t<(FX_LIFE[f.type]||0.4));
  for(const q of G.parts){q.t+=dt;q.x+=q.vx*dt;q.y+=q.vy*dt;q.vx*=0.92;q.vy*=0.92;}
  G.parts=G.parts.filter(q=>q.t<q.life);
  for(const d of G.dmgTx)d.t+=dt;
  G.dmgTx=G.dmgTx.filter(d=>d.t<0.6);
  G.shake=Math.max(0,G.shake-dt*30);
}
// fx 종류별 수명(초) — 없으면 0.4
const FX_LIFE={ilseom:0.5,synflash:1.4,resmsg:2.2,finflash:0.6,ghost:0.3,
  promote:0.9,summonpop:0.55,nametag:1.2,elitewarn:1.6};
// 공격 스윙 — 이 시간만큼 선행해서 포즈를 잡고, 종료 프레임에 검기/투사체가 나간다.
// 쿨다운은 스윙 시작 시점에 리셋되므로 정상 상태의 공격 주기는 변하지 않는다.
const SWING=0.14;
function swingStart(s,tg,dx,dy,l){ s.sw=SWING; s.swTg=tg; s.face={x:dx/l,y:dy/l}; }
// 스윙 종료 프레임 — 실제 타격/발사
function summonFire(s){
  const range=s.id==="crane"?420:s.id==="relic2"?60:140;
  const tg=(s.swTg&&!s.swTg.dead)?s.swTg:nearestEnemy(s.x,s.y,range);
  s.swTg=null;
  if(!tg)return;                              // 대상이 사라졌으면 헛스윙
  const dx=tg.x-s.x,dy=tg.y-s.y,l=Math.hypot(dx,dy)||1;
  if(s.id==="seo"){
    s.combo=((s.combo||0)+1)%3;
    hitEnemy(tg,(s.combo===2?20:12)*mul("seo"),"seo");
    G.fx.push({type:"slash",x:tg.x,y:tg.y,t:0});
    if(s.combo===2||synStep("sword")>=1)wave(s.x,s.y,dx/l,dy/l,12*mul("seo"),"seo");
  }else if(s.id==="wolf"){
    if(l<34)hitEnemy(tg,8*mul("wolf"),"wolf");
  }else if(s.id==="crane"){
    G.shots.push({x:s.x,y:s.y,vx:dx/l*330,vy:dy/l*330,dmg:10*mul("crane"),src:"crane",life:1.6,pierce:0});
  }else if(s.id==="relic2"){
    if(l<44){hitEnemy(tg,14*mul("relic2"),"relic2");
      if(synStep("sword")>=1)wave(s.x,s.y,dx/l,dy/l,9*mul("relic2"),"relic2");}
  }
}
function wave(x,y,dx,dy,dmg,src){
  G.shots.push({x,y,vx:dx*380,vy:dy*380,dmg,src,life:0.9,pierce:99,wave:true});
}
function radial(e,n,spd,dmg){
  for(let i=0;i<n;i++){const a=TAU*i/n;
    G.eshots.push({x:e.x,y:e.y,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,dmg,life:4});}
}
function nearestEnemy(x,y,range){
  let best=null,bd=range*range;
  for(const e of G.enemies){if(e.dead)continue;
    const d=(e.x-x)**2+(e.y-y)**2;if(d<bd){bd=d;best=e;}}
  return best;
}

// ---------- 렌더 ----------
function inkBlob(x,y,r,wob,col){
  ctx.fillStyle=col;ctx.beginPath();
  for(let i=0;i<=10;i++){const a=TAU*i/10;
    const rr=r*(1+0.12*Math.sin(a*3+wob));
    if(i===0)ctx.moveTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr);
    else ctx.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr);}
  ctx.closePath();ctx.fill();
}
function drawFigure(x,y,col,scale=1){ // 도포 실루엣 (플레이어/유서린)
  ctx.save();ctx.translate(x,y);ctx.scale(scale,scale);
  ctx.fillStyle=col;
  ctx.beginPath(); // 도포
  ctx.moveTo(0,-14);ctx.quadraticCurveTo(9,-10,8,2);ctx.quadraticCurveTo(10,10,6,12);
  ctx.lineTo(-7,12);ctx.quadraticCurveTo(-12,8,-9,-2);ctx.quadraticCurveTo(-9,-10,0,-14);
  ctx.fill();
  ctx.beginPath();ctx.arc(0,-17,4.6,0,TAU);ctx.fill(); // 머리
  ctx.fillRect(-1.5,-24,3,4); // 상투
  ctx.restore();
}
function draw(){
  ctx.save();
  if(G&&G.shake>0)ctx.translate(rnd(-G.shake,G.shake),rnd(-G.shake,G.shake));
  ctx.fillStyle=PAPER;ctx.fillRect(-10,-10,W+20,H+20);
  // 종이 결
  ctx.globalAlpha=0.5;ctx.strokeStyle="#e2dbcc";
  for(let i=0;i<14;i++){ctx.beginPath();ctx.moveTo(0,i*40+13);ctx.lineTo(W,i*40+9);ctx.stroke();}
  ctx.globalAlpha=1;

  if(scene==="title"){drawTitle();ctx.restore();return;}
  if(!G){ctx.restore();return;}
  const p=G.p;

  // 젬 (원기)
  for(const g of G.gems){
    if(spr("gem",g.x,g.y))continue;
    ctx.fillStyle=GOLD;ctx.beginPath();
    ctx.moveTo(g.x,g.y-4);ctx.lineTo(g.x+3.5,g.y);ctx.lineTo(g.x,g.y+4);ctx.lineTo(g.x-3.5,g.y);
    ctx.closePath();ctx.fill();}
  // 적
  for(const e of G.enemies){
    const flip = e.x > p.x;
    if(!spr(e.k, e.x, e.y, e.boss?1:1, flip)){
      const col=e.k==="wraith"?"#3a3630":e.k==="ram"?"#2a2723":e.boss?"#17131a":INK;
      inkBlob(e.x,e.y,e.r,e.wob,col);
      if(e.k==="wraith"){ctx.fillStyle=PAPER;ctx.fillRect(e.x-3,e.y-2,2,2);ctx.fillRect(e.x+1,e.y-2,2,2);}
    }
    if(e.flash>0){ // 히트 플래시 — 흰 점멸
      ctx.globalAlpha=0.85;inkBlob(e.x,e.y,e.r*1.04,e.wob,"#fffdf7");ctx.globalAlpha=1;}
    if(e.k==="ram"&&e.state==="aim"){ // 돌진 예고선
      ctx.strokeStyle=RED;ctx.globalAlpha=0.5;ctx.setLineDash([6,5]);
      ctx.beginPath();ctx.moveTo(e.x,e.y);ctx.lineTo(e.tx,e.ty);ctx.stroke();
      ctx.setLineDash([]);ctx.globalAlpha=1;}
    if(e.k==="boss"&&e.state==="aim"){ctx.strokeStyle=RED;ctx.globalAlpha=0.6;ctx.setLineDash([8,6]);
      ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(e.x,e.y);ctx.lineTo(e.tx,e.ty);ctx.stroke();
      ctx.lineWidth=1;ctx.setLineDash([]);ctx.globalAlpha=1;}
    if(e.boss){ // 이름/체력바
      ctx.fillStyle=INK;ctx.fillRect(W/2-160,14,320,10);
      ctx.fillStyle=RED;ctx.fillRect(W/2-158,16,316*clamp(e.hp/e.hpMax,0,1),6);
      ctx.fillStyle=INK;ctx.font="12px serif";ctx.textAlign="center";
      ctx.fillText(e.name,W/2,38);}
  }
  // 적탄
  ctx.fillStyle="#5a2420";
  for(const s of G.eshots){ctx.beginPath();ctx.arc(s.x,s.y,4,0,TAU);ctx.fill();}
  // 아군 투사체
  for(const s of G.shots){
    if(s.wave){ctx.strokeStyle=BLUE;ctx.globalAlpha=0.8;ctx.lineWidth=2.5;
      ctx.beginPath();const a=Math.atan2(s.vy,s.vx);
      ctx.arc(s.x,s.y,10,a-1.1,a+1.1);ctx.stroke();ctx.lineWidth=1;ctx.globalAlpha=1;}
    else{ctx.strokeStyle="#7a8a94";ctx.beginPath();ctx.moveTo(s.x,s.y);
      ctx.lineTo(s.x-s.vx*0.03,s.y-s.vy*0.03);ctx.stroke();}
  }
  // 소환수 — 경지 변형 + 스윙 포즈/런지
  for(const s of G.summons){
    if(s.id==="seo"&&G.resT>0)continue;
    const tgn=nearestEnemy(s.x,s.y,400);
    const sw=s.sw>0?1-clamp(s.sw/SWING,0,1):-1;        // 0→1 스윙 진행, -1 = 평상
    const fd=(s.sw>0&&s.face)?s.face
      :(tgn?{x:Math.sign(tgn.x-s.x)||1,y:0}:(s.face||{x:1,y:0}));
    const lung=sw>=0?Math.sin(sw*Math.PI)*4:0;         // 대상 방향 전진 런지 4px
    ctx.save();ctx.translate(fd.x*lung,fd.y*lung);
    drawSummonBody(s,fd,sw);
    ctx.restore();
    if(sw>=0&&!IMG[s.id+"_atk"])drawSwingArc(s,fd,sw); // _atk 없는 유닛의 무기 호 폴백
  }
  drawFieldTail(p);
  drawHUD();
  if(scene==="levelup")drawLevelup();
  if(scene==="pause")drawPause();
  if(scene==="over")drawOver();
  if(scene==="win")drawWin();
  ctx.restore();
}
function drawSwingArc(s,fd,sw){
  const a=Math.atan2(fd.y,fd.x),sweep=(sw-0.5)*1.9;
  ctx.save();
  ctx.strokeStyle=s.id==="crane"?"#7a8a94":s.id==="wolf"?"#4a5a66":s.id==="turtle"?"#5d6155":BLUE;
  ctx.globalAlpha=Math.max(0,0.75*(1-Math.abs(sw-0.5)*1.2));
  ctx.lineWidth=2.5;ctx.lineCap="round";
  ctx.beginPath();ctx.arc(s.x,s.y,15,a+sweep-0.45,a+sweep+0.45);ctx.stroke();
  ctx.restore();
}
function drawSummonBody(s,fd,sw){
  const flip=fd.x<0;
  const mark=()=>{ if(s.id==="seo"&&G.roster.relic1){ctx.strokeStyle="#8a9aa8";
    ctx.beginPath();ctx.moveTo(s.x-11,s.y-12);ctx.lineTo(s.x-11,s.y-2);ctx.stroke();} };
  if(sw>=0&&IMG[s.id+"_atk"]&&spr(s.id+"_atk",s.x,s.y,1,flip)){mark();return;}
  if(spr(tierVariant(s.id),s.x,s.y,1,flip)){mark();return;}
  {
    if(s.id==="seo"){drawFigure(s.x,s.y,NAVY,0.9);
      ctx.strokeStyle=BLUE;ctx.beginPath();ctx.moveTo(s.x+6,s.y-8);ctx.lineTo(s.x+6,s.y+10);ctx.stroke();
      if(G.roster.relic1){ctx.strokeStyle="#8a9aa8";ctx.beginPath();
        ctx.moveTo(s.x-9,s.y-12);ctx.lineTo(s.x-9,s.y-2);ctx.stroke();}}
    else if(s.id==="wolf"){inkBlob(s.x,s.y,8,performance.now()/200,"#4a5a66");
      ctx.fillStyle="#4a5a66";ctx.beginPath();ctx.moveTo(s.x-4,s.y-7);ctx.lineTo(s.x-1,s.y-12);ctx.lineTo(s.x+1,s.y-7);ctx.fill();
      ctx.beginPath();ctx.moveTo(s.x+1,s.y-7);ctx.lineTo(s.x+4,s.y-12);ctx.lineTo(s.x+6,s.y-7);ctx.fill();}
    else if(s.id==="crane"){ctx.fillStyle="#7a8a94";
      ctx.beginPath();ctx.ellipse(s.x,s.y,9,5,Math.sin(performance.now()/300)*0.3,0,TAU);ctx.fill();
      ctx.strokeStyle="#7a8a94";ctx.beginPath();ctx.moveTo(s.x+7,s.y-2);ctx.lineTo(s.x+13,s.y-5);ctx.stroke();}
    else if(s.id==="turtle"){ctx.fillStyle="#5d6155";
      ctx.beginPath();ctx.arc(s.x,s.y,10,0,TAU);ctx.fill();
      ctx.strokeStyle=PAPER;ctx.globalAlpha=0.4;
      ctx.beginPath();ctx.arc(s.x,s.y,6,0,TAU);ctx.stroke();ctx.globalAlpha=1;}
    else if(s.id==="relic2"){ctx.save();ctx.translate(s.x,s.y);
      ctx.rotate(performance.now()/300);
      ctx.strokeStyle="#3a4a58";ctx.lineWidth=2.5;
      ctx.beginPath();ctx.moveTo(0,-10);ctx.lineTo(0,10);ctx.stroke();
      ctx.lineWidth=1;ctx.restore();}
  }
}
// 소환수 이후 — 플레이어·파티클·fx·피해 숫자·모바일 UI
function drawFieldTail(p){
  // 플레이어 도윤 (식별 링 + 공명 시 빙의 형상)
  ctx.strokeStyle=GOLD;ctx.globalAlpha=0.7;ctx.setLineDash([4,4]);
  ctx.beginPath();ctx.ellipse(p.x,p.y+13,13,5,0,0,TAU);ctx.stroke();
  ctx.setLineDash([]);ctx.globalAlpha=1;
  if(p.inv>0&&Math.floor(p.inv*20)%2===0){}
  else if(G.resT>0){ // 공명: 유서린의 검을 쥔다
    ctx.strokeStyle=BLUE;ctx.globalAlpha=0.35;
    ctx.beginPath();ctx.arc(p.x,p.y-4,20+Math.sin(performance.now()/90)*3,0,TAU);ctx.stroke();ctx.globalAlpha=1;
    if(!spr("player_res",p.x,p.y,1,p.dx<0)){
      drawFigure(p.x,p.y,NAVY,1);
      ctx.strokeStyle=BLUE;ctx.lineWidth=2;
      ctx.beginPath();ctx.moveTo(p.x+7,p.y-10);ctx.lineTo(p.x+7,p.y+11);ctx.stroke();ctx.lineWidth=1;}
  }else if(!spr("player",p.x,p.y,1,p.dx<0)) drawFigure(p.x,p.y,"#33404e",1);
  if(p.flash>0){ctx.globalAlpha=0.8;drawFigure(p.x,p.y,"#fffdf7",1);ctx.globalAlpha=1;}
  if(p.shield>0){ctx.strokeStyle=BLUE;ctx.globalAlpha=0.6;
    ctx.beginPath();ctx.arc(p.x,p.y-4,17,0,TAU);ctx.stroke();ctx.globalAlpha=1;}
  // 파티클
  for(const q of G.parts){
    const a=Math.max(0,1-q.t/q.life);
    ctx.globalAlpha=a;ctx.fillStyle=q.col;
    if(q.blot){ // 먹 번짐 — 퍼지며 옅어지는 얼룩
      ctx.globalAlpha=a*0.45;inkBlob(q.x,q.y,q.size*(1+q.t*3),q.t*6,q.col);}
    else if(q.streak){ // 튀김 — 진행 방향으로 늘어난 획
      ctx.strokeStyle=q.col;ctx.lineWidth=q.size*0.7;
      ctx.beginPath();ctx.moveTo(q.x,q.y);
      ctx.lineTo(q.x-q.vx*0.022,q.y-q.vy*0.022);ctx.stroke();ctx.lineWidth=1;}
    else ctx.fillRect(q.x-q.size/2,q.y-q.size/2,q.size,q.size);}
  ctx.globalAlpha=1;
  // 공명 중 화면 테두리 오라
  if(G.resT>0){ctx.strokeStyle=BLUE;ctx.globalAlpha=0.22+0.1*Math.sin(performance.now()/120);
    ctx.lineWidth=14;ctx.strokeRect(7,7,W-14,H-14);ctx.lineWidth=1;ctx.globalAlpha=1;}
  // fx
  for(const f of G.fx){
    if(f.type==="splash"){ctx.fillStyle=INK;ctx.globalAlpha=0.5*(1-f.t/0.4);
      for(let i=0;i<3;i++)ctx.fillRect(f.x+Math.cos(i*2.1)*f.t*60,f.y+Math.sin(i*2.1)*f.t*60,2.5,2.5);
      ctx.globalAlpha=1;}
    else if(f.type==="slash"){ctx.strokeStyle=BLUE;ctx.globalAlpha=1-f.t/0.4;
      ctx.beginPath();ctx.moveTo(f.x-10+f.t*40,f.y+8-f.t*30);ctx.lineTo(f.x+8+f.t*40,f.y-10-f.t*30);ctx.stroke();ctx.globalAlpha=1;}
    else if(f.type==="erase"){ctx.strokeStyle=GREY;ctx.globalAlpha=1-f.t/0.4;
      ctx.beginPath();ctx.arc(f.x,f.y,f.r+f.t*50,0,TAU);ctx.stroke();
      ctx.globalAlpha=0.5*(1-f.t/0.4);
      ctx.beginPath();ctx.arc(f.x,f.y,f.r*0.5+f.t*95,0,TAU);ctx.stroke();ctx.globalAlpha=1;}
    else if(f.type==="ghost"){ctx.globalAlpha=0.3*(1-f.t/0.3);
      drawFigure(f.x,f.y,f.col,1);ctx.globalAlpha=1;}
    else if(f.type==="ilseom"){ // 일섬 — 전장을 가로지르는 붓질 한 획
      const pr=clamp(f.t/0.5,0,1),fade=1-pr,sd=f.seed||0,N=26;
      ctx.globalAlpha=0.92*fade;ctx.fillStyle=INK;
      ctx.beginPath();
      for(let i=0;i<=N;i++){const u=i/N,x=u*W,th=11*Math.pow(Math.sin(Math.PI*u),0.6)+1;
        const yy=f.y-th+Math.sin(u*9+sd)*2.2;
        if(i===0)ctx.moveTo(x,yy);else ctx.lineTo(x,yy);}
      for(let i=N;i>=0;i--){const u=i/N,x=u*W,th=11*Math.pow(Math.sin(Math.PI*u),0.6)+1;
        ctx.lineTo(x,f.y+th*0.55+Math.sin(u*9+sd)*2.2);}
      ctx.closePath();ctx.fill();
      ctx.globalAlpha=Math.max(0,1-pr*1.8);ctx.fillStyle="#fffdf7";
      ctx.fillRect(pr*W*1.15-70,f.y-9,70,18);          // 선단 백섬광
      ctx.globalAlpha=0.5*fade;ctx.fillStyle=INK;
      for(let i=0;i<10;i++){const u=(i*0.11+sd*0.07)%1;
        ctx.fillRect(u*W,f.y+Math.sin(i*3.3+sd)*22,2.2,2.2);}   // 흩날린 먹점
      ctx.globalAlpha=1;}
    else if(f.type==="dashline"){ctx.strokeStyle="#33404e";ctx.globalAlpha=0.5*(1-f.t/0.4);
      ctx.beginPath();ctx.moveTo(f.x,f.y);ctx.lineTo(f.x-f.dx*60,f.y-f.dy*60);ctx.stroke();ctx.globalAlpha=1;}
    else if(f.type==="shieldpop"){ctx.strokeStyle=BLUE;ctx.globalAlpha=1-f.t/0.4;
      ctx.beginPath();ctx.arc(f.x,f.y,17+f.t*60,0,TAU);ctx.stroke();ctx.globalAlpha=1;}
    else if(f.type==="just"){ctx.strokeStyle=GOLD;ctx.globalAlpha=1-f.t/0.4;ctx.lineWidth=2;
      ctx.beginPath();ctx.arc(f.x,f.y,12+f.t*70,0,TAU);ctx.stroke();ctx.lineWidth=1;ctx.globalAlpha=1;}
    else if(f.type==="finflash"){ctx.strokeStyle=BLUE;ctx.globalAlpha=1-f.t/0.6;ctx.lineWidth=4;
      ctx.beginPath();ctx.arc(f.x,f.y,f.t*260,0,TAU);ctx.stroke();ctx.lineWidth=1;ctx.globalAlpha=1;}
    else if(f.type==="promote"){ // 승급 — 먹 번짐 펄스 + 경지명
      const pr=f.t/0.9,fade=1-pr,R=f.big?70:44;
      const x=f.s?f.s.x:f.x,y=f.s?f.s.y:f.y;
      ctx.globalAlpha=0.22*fade;
      inkBlob(x,y,14+pr*R*0.5,pr*6,f.big?GOLD:INK);
      ctx.globalAlpha=0.8*fade;ctx.strokeStyle=f.big?GOLD:BLUE;ctx.lineWidth=f.big?3:2;
      ctx.beginPath();ctx.arc(x,y,10+pr*R,0,TAU);ctx.stroke();
      if(f.big){ctx.globalAlpha=0.45*fade;
        ctx.beginPath();ctx.arc(x,y,10+pr*R*0.55,0,TAU);ctx.stroke();}
      ctx.lineWidth=1;
      ctx.globalAlpha=Math.min(1,fade*2.2);
      ctx.fillStyle=f.big?"#7a5c14":INK;ctx.textAlign="center";
      ctx.font=(f.big?"bold 19px":"bold 15px")+" serif";
      ctx.fillText(TIERS[f.tier-1],x,y-26-pr*16);
      ctx.globalAlpha=1;}
    else if(f.type==="summonpop"){ // 신규 계약 — 먹 번짐 스폰
      const pr=f.t/0.55,fade=1-pr;
      ctx.globalAlpha=0.3*fade;inkBlob(f.x,f.y,10+pr*34,pr*7,INK);
      ctx.globalAlpha=0.85*fade;ctx.strokeStyle=INK;ctx.lineWidth=2;
      ctx.beginPath();ctx.arc(f.x,f.y,8+pr*40,0,TAU);ctx.stroke();
      ctx.lineWidth=1;ctx.globalAlpha=1;}
    else if(f.type==="nametag"){ // 새 개체 이름표
      const x=f.s?f.s.x:f.x,y=f.s?f.s.y:f.y,u=UNITS[f.s?f.s.id:f.id];
      ctx.globalAlpha=Math.max(0,Math.min(1,Math.min(f.t*6,(1.2-f.t)*4)));
      ctx.font="bold 12px serif";ctx.textAlign="center";
      const tw=ctx.measureText(u.name).width+16;
      ctx.fillStyle=PAPER;ctx.fillRect(x-tw/2,y-42,tw,18);
      ctx.strokeStyle=INK;ctx.strokeRect(x-tw/2,y-42,tw,18);
      ctx.fillStyle=INK;ctx.fillText(u.name,x,y-29);
      ctx.beginPath();ctx.moveTo(x-4,y-24);ctx.lineTo(x,y-19);ctx.lineTo(x+4,y-24);
      ctx.fillStyle=PAPER;ctx.fill();ctx.stroke();
      ctx.globalAlpha=1;}
    else if(f.type==="elitewarn"){
      ctx.globalAlpha=Math.min(1,(1.6-f.t)*1.4);
      ctx.fillStyle=RED;ctx.font="bold 17px serif";ctx.textAlign="center";
      ctx.fillText("돌귀 무리가 밀려온다",W/2,152);ctx.globalAlpha=1;}
    else if(f.type==="resmsg"){ctx.globalAlpha=Math.min(1,2.2-f.t);
      ctx.fillStyle=INK;ctx.font="bold 17px serif";ctx.textAlign="center";
      ctx.fillText("공명(共鳴) — 그녀의 검을, 직접 쥔다",W/2,120);ctx.globalAlpha=1;}
  }
  // 암전 펄스 (공명 발동·보스 등장/격파)
  if(G.dimT>0){const a=clamp(G.dimT/0.45,0,1);
    ctx.fillStyle="rgba(20,18,15,"+(0.5*a*a).toFixed(3)+")";ctx.fillRect(-10,-10,W+20,H+20);}
  // 피해 숫자
  ctx.font="11px sans-serif";ctx.textAlign="center";
  for(const d of G.dmgTx){ctx.fillStyle=INK;ctx.globalAlpha=1-d.t/0.6;
    ctx.fillText(d.v,d.x,d.y-d.t*30);ctx.globalAlpha=1;}
  // --- 모바일 UI: 조이스틱 시각화 + 경공 버튼 ---
  if(IS_TOUCH&&(scene==="play"||scene==="pause")){
    if(touchMove){
      ctx.strokeStyle=GREY;ctx.globalAlpha=0.5;
      ctx.beginPath();ctx.arc(touchMove.ox,touchMove.oy,30,0,TAU);ctx.stroke();
      const dx=touchMove.x-touchMove.ox,dy=touchMove.y-touchMove.oy,l=Math.hypot(dx,dy)||1;
      const kl=Math.min(l,30);
      ctx.fillStyle=INK;ctx.globalAlpha=0.45;
      ctx.beginPath();ctx.arc(touchMove.ox+dx/l*kl,touchMove.oy+dy/l*kl,12,0,TAU);ctx.fill();
      ctx.globalAlpha=1;
    }
    // 경공 — 먹빛 원 + 갈매기 아이콘
    const b=DASH_BTN,ready=G.p.dashCd<=0;
    ctx.save();ctx.textAlign="center";
    ctx.globalAlpha=ready?0.82:0.45;
    ctx.fillStyle=ready?"#2b3642":"#b9b2a5";
    ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,TAU);ctx.fill();
    ctx.globalAlpha=ready?0.9:0.5;ctx.strokeStyle=INK;ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,TAU);ctx.stroke();
    if(!ready){ctx.strokeStyle=PAPER;ctx.lineWidth=3;
      ctx.beginPath();ctx.arc(b.x,b.y,b.r-4,-Math.PI/2,-Math.PI/2+TAU*(1-G.p.dashCd/1.5));ctx.stroke();}
    ctx.globalAlpha=ready?1:0.6;
    ctx.strokeStyle=PAPER;ctx.lineWidth=3;ctx.lineCap="round";
    for(let i=0;i<2;i++){const ox=b.x-7+i*10;
      ctx.beginPath();ctx.moveTo(ox-4,b.y-12);ctx.lineTo(ox+4,b.y-4);ctx.lineTo(ox-4,b.y+4);ctx.stroke();}
    ctx.lineCap="butt";ctx.lineWidth=1;
    ctx.fillStyle=PAPER;ctx.font="bold 11px serif";
    ctx.fillText("경공",b.x,b.y+21);
    ctx.restore();
    // 공명 — 청 원 + 종 아이콘
    const rb=RES_BTN,rready=G.res>=100&&G.resT<=0;
    ctx.save();ctx.textAlign="center";
    ctx.globalAlpha=rready?0.85:0.4;
    ctx.fillStyle=rready?BLUE:"#b9b2a5";
    ctx.beginPath();ctx.arc(rb.x,rb.y,rb.r,0,TAU);ctx.fill();
    ctx.globalAlpha=rready?0.95:0.55;ctx.strokeStyle=INK;ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(rb.x,rb.y,rb.r,0,TAU);ctx.stroke();
    if(!rready&&G.resT<=0){ctx.strokeStyle=BLUE;ctx.lineWidth=3;
      ctx.beginPath();ctx.arc(rb.x,rb.y,rb.r-4,-Math.PI/2,-Math.PI/2+TAU*G.res/100);ctx.stroke();}
    ctx.globalAlpha=1;ctx.lineWidth=1;
    ctx.fillStyle=rready?PAPER:"#6b655c";
    ctx.beginPath();ctx.moveTo(rb.x-8,rb.y+2);
    ctx.quadraticCurveTo(rb.x-8,rb.y-10,rb.x,rb.y-12);
    ctx.quadraticCurveTo(rb.x+8,rb.y-10,rb.x+8,rb.y+2);
    ctx.closePath();ctx.fill();
    ctx.fillRect(rb.x-10,rb.y+2,20,2.5);
    ctx.beginPath();ctx.arc(rb.x,rb.y+7,2,0,TAU);ctx.fill();
    ctx.font="bold 10px serif";
    ctx.fillText("공명",rb.x,rb.y+21);
    ctx.restore();
  }
}

function wrapText(txt,cx,y,maxW,lh){
  const words=txt.split(" ");let line="";
  for(const w of words){
    if(ctx.measureText(line+w).width>maxW){ctx.fillText(line,cx,y);line=w+" ";y+=lh;}
    else line+=w+" ";}
  ctx.fillText(line.trim(),cx,y);
}

    ctx.fillText("아무 곳이나 드래그 — 이동 · 우하단 [경공] 회피 · 그 위 [공명] 빙의",cx,362);

  }
  ctx.fillStyle=INK;ctx.font="bold 18px serif";
